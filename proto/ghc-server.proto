syntax = "proto3";

package ghcserver;

// Mirrors 'worker.proto''s 'ExecuteCommand'/'ExecuteResponse', duplicated here so 'ghc-server''s own protocol can
// evolve independently of Buck's persistent-worker protocol.
message ExecuteCommand {
  message EnvironmentEntry {
    bytes key = 1;
    bytes value = 2;
  }

  repeated bytes argv = 1;
  repeated EnvironmentEntry env = 2;
}

message ExecuteResponse {
  int32 exit_code = 1;
  string stderr = 2;
}

// The directories to clean are still hardcoded server-side (the client never sends absolute paths), but the
// scope within the project can now be narrowed via 'target': the sentinel "*" or an empty string for the whole
// project (all units), a bare unit name for a single unit, or "unitName:moduleName" for a single module within a
// unit.
message CleanRequest {
  string target = 1;
}

message CleanResponse {
  bool success = 1;
  string message = 2;
}

service GhcServer {
  rpc Execute(ExecuteCommand) returns (ExecuteResponse) {};
  // Removes the project's 'output' and 'cache' directories (server-generated, fully reconstructible build
  // artifacts).
  rpc Clean(CleanRequest) returns (CleanResponse) {};
}
